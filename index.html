<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CorteFino | Agenda tu cita en la barbería</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #F3F1EA
        }

        .Cabezote {
            background: #1C1C1C;
            color: white;
            padding: 24px
        }

        #cajaPrincipal {
            width: 900px;
            margin: 0 auto
        }

        .Servicio_Card {
            background: white;
            padding: 16px;
            border: 1px solid #D9D5C7;
            border-radius: 12px;
            float: left;
            width: 280px;
            margin-right: 16px
        }

        .servicio2 {
            background: white;
            padding: 16px;
            border: 1px solid #D9D5C7;
            border-radius: 12px;
            float: left;
            width: 280px;
            margin-right: 16px
        }

        .BtnAgendar {
            background: #F2C14E;
            color: #1C1C1C;
            padding: 10px 16px;
            border: none;
            border-radius: 8px !important;
            font-size: 14px
        }

        .BtnAgendar:hover {
            background: white
        }

        h2 {
            color: #1C1C1C
        }
    </style>
</head>

<body>
    <header class="Cabezote">
        <h1>CorteFino</h1>
        <h1>Agenda tu cita en la barbería</h1>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
        </nav>
    </header>

    <main id="cajaPrincipal">
        <section id="servicios">
            <h2>Servicios</h2>

            <article class="Servicio_Card">
                <img src="foto1.jpg" alt="Corte clásico">
                <h3 style="color:red;font-size:18px">Corte clásico</h3>
                <p style="color:gray">$25.000</p>
                <p>30 minutos</p>
                <button class="BtnAgendar" type="button">Agendar</button>
            </article>

            <article class="servicio2">
                <img src="foto2.jpg" alt="Corte con barba">
                <h3 style="color:red;font-size:18px">Corte + barba</h3>
                <p style="color:gray">$40.000</p>
                <p>50 minutos</p>
                <button class="BtnAgendar" type="button">Agendar</button>
            </article>

            <article class="servicio2">
                <img src="foto3.jpg" alt="Perfilado de cejas">
                <h3 style="color:red;font-size:18px">Cejas</h3>
                <p style="color:gray">$8.000</p>
                <p>10 minutos</p>
                <button class="BtnAgendar" type="button">Agendar</button>
            </article>
        </section>
    </main>

    <footer class="Cabezote">
        <p>CorteFino · Barranquilla</p>
    </footer>
</body>

</html>
