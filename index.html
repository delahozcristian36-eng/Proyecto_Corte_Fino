<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CorteFino | Agenda tu cita en la barbería</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="Cabezote">
       <h1>CorteFino</h1>
       <p>Agenda tu cita en la barbería</p>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
        </nav>
    </header>

    <main id="cajaPrincipal">
        <section id="servicios">
            <h2>Servicios</h2>

            <article class="Servicio_Card">
                <img src="foto1.jpg" alt="Corte clásico">
                <h3>Corte clásico</h3>
<p>$25.000</p>
<p>30 minutos</p>
                <button class="BtnAgendar" type="button">Agendar</button>
            </article>

            <article class="servicio2">
                <h3>Corte + barba</h3>
<p>$40.000</p>
                <p style="color:gray">$40.000</p>
                <p>50 minutos</p>
                <button class="BtnAgendar" type="button">Agendar</button>
            </article>

            <article class="servicio2">
    <img src="foto2.jpg" alt="Corte con barba">
    <h3>Corte + barba</h3>
    <p>$40.000</p>
    <p>50 minutos</p>
    <button class="BtnAgendar" type="button">Agendar</button>
</article>
        </section>
    </main>

    <footer class="Cabezote">
        <p>CorteFino · Barranquilla</p>
    </footer>
</body>

</html>
